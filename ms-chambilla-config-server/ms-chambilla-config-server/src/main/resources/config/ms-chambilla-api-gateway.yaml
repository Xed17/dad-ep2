server:
  port: 8080

spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: instructor-route
            uri: lb://ms-gestion-instructor
            predicates:
              - Path=/instructores/**

          - id: alumno-route
            uri: lb://ms-gestion-alumno
            predicates:
              - Path=/alumnos/**

          - id: taller-route
            uri: lb://ms-gestion-taller
            predicates:
              - Path=/talleres/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
