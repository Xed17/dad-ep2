server:
  port: 8080

spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: ms-gestion-instructor-route
            uri: lb://ms-gestion-instructor
            predicates:
              - Path=/api/instructores/**

          - id: ms-gestion-alumno-route
            uri: lb://ms-gestion-alumno
            predicates:
              - Path=/api/alumnos/**

          - id: ms-gestion-taller-route
            uri: lb://ms-gestion-taller
            predicates:
              - Path=/api/talleres/**,/api/alumnos/*/talleres

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
