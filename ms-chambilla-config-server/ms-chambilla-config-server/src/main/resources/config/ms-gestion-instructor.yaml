server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bd_instructor
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.example: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
